# SearXNG overrides on top of the image defaults.
# Only list what differs from the defaults, so image upgrades stay painless.
use_default_settings:
  engines:
    # DuckDuckGo only (one provider per query). Brave web was dropped in 2026-11:
    # Brave cloaks result URLs as /go/v1/... redirects, which SearXNG can't resolve
    # (searxng/searxng#6967; upstream disabled the engine).
    keep_only:
      - duckduckgo
      - duckduckgo images
      - duckduckgo videos
      - duckduckgo news

general:
  enable_metrics: false

search:
  # json is required by Open WebUI web search
  formats:
    - html
    - json

server:
  # internal-only, no bot protection needed
  limiter: false
  public_instance: false
  # secret_key comes from SEARXNG_SECRET (see .env)
