services:

  # ─────────────────────────────────────────
  # SearXNG – local privacy-respecting meta-search engine
  # ─────────────────────────────────────────
  searxng:
    # Pinned to a tested version; see README "Upgrading"
    image: searxng/searxng:2026.10.23-629368e40
    container_name: searxng
    restart: unless-stopped
    volumes:
      - ./config/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      # Set in .env (generated by `make env`)
      - SEARXNG_SECRET=${SEARXNG_SECRET:?run `make env` to create .env}
      - FORWARDED_ALLOW_IPS=*
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

  # ─────────────────────────────────────────
  # Open WebUI – chat interface
  # ─────────────────────────────────────────
  open-webui:
    # Pinned to a tested version; check env var names before upgrading (README "Upgrading")
    image: ghcr.io/open-webui/open-webui:v0.12.4
    container_name: open-webui
    restart: unless-stopped
    ports:
      # localhost only, not reachable from the LAN
      - "127.0.0.1:3000:8080"
    volumes:
      - ./data/open-webui:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
      # Block openwebui.com (bare domain only; the update check goes to GitHub)
      - "openwebui.com:127.0.0.1"
    environment:
      # Ollama running natively on the host (brew) – Metal/GPU enabled
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      # New-version banner: one anonymous GET to api.github.com (latest release tag),
      # no chat data. Kept on so security releases get noticed.
      - ENABLE_VERSION_UPDATE_CHECK=true
      # Everything below except HF_HUB_OFFLINE and WEBUI_SECRET_KEY is only applied
      # when the database is created; afterwards it is a stored setting changed in
      # the UI (see docs/open-webui-setup.md).
      # Web search via SearXNG
      - ENABLE_WEB_SEARCH=true
      - WEB_SEARCH_ENGINE=searxng
      - SEARXNG_QUERY_URL=http://searxng:8080/search?q=<query>&format=json
      # Privacy: no OpenAI connection, no community sharing
      - ENABLE_OPENAI_API=false
      - ENABLE_COMMUNITY_SHARING=false
      # Background tasks use the 4b-fast preset (thinking off, created in the UI);
      # follow-ups and tags are extra generations we don't need
      - TASK_MODEL=4b-fast
      - DEFAULT_MODELS=4b-fast
      - ENABLE_FOLLOW_UP_GENERATION=false
      - ENABLE_TAGS_GENERATION=false
      # Context compaction: once a chat passes the threshold, older messages are
      # summarized by 4b-fast and replaced by the summary (the UI still shows them).
      # Checked before web search results are added, so the threshold leaves ~5k of
      # num_ctx 16384 for search results, the summary and the answer.
      - ENABLE_CONTEXT_COMPACTION=true
      - CONTEXT_COMPACTION_MODEL=4b-fast
      - CONTEXT_COMPACTION_TOKEN_THRESHOLD=11000
      # Multilingual embedding model for picking relevant parts of fetched pages
      # (the default all-MiniLM-L6-v2 is English-only and misses Polish pages).
      # The model is a stored setting (fresh DB only); the e5 prefixes below are
      # read on every start. Quoted: the trailing space is part of the prefix.
      - RAG_EMBEDDING_MODEL=intfloat/multilingual-e5-small
      - "RAG_EMBEDDING_QUERY_PREFIX=query: "
      - "RAG_EMBEDDING_CONTENT_PREFIX=passage: "
      # No Hugging Face calls; `make setup` downloads the embedding model once into
      # data/open-webui/cache (keep RAG_EMBEDDING_MODEL in sync with EMBED_MODEL in the Makefile).
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      # Set in .env (generated by `make env`)
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:?run `make env` to create .env}
    depends_on:
      - searxng